name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  docker-compose-validation:
    name: Validate Docker Compose
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate default compose configuration
        run: docker compose config --quiet

      - name: Validate tunnel profile configuration
        run: docker compose --profile tunnel config --quiet

  api-quality-and-tests:
    name: Lint, Unit Tests & Robot Syntax
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install lint, test and Robot Framework dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fastapi uvicorn pydantic httpx ruff robotframework

      - name: Run Ruff linter
        working-directory: services/rpa-api
        run: ruff check app tests

      - name: Run API unit tests
        working-directory: services/rpa-api
        run: python -m unittest discover -s tests -v

      - name: Validate Robot Framework suite syntax
        working-directory: services/rpa-api
        run: |
          python -c "
          from robot.api import get_model
          for path in ('robot/rpa_login.robot', 'robot/resources/keywords.resource'):
              model = get_model(path)
              errors = list(model.errors)
              assert not errors, f'Syntax errors in {path}: {errors}'
          print('Robot Framework syntax valid')
          "
